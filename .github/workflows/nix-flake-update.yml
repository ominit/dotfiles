name: Update flake lock
on:
  schedule:
    - cron: "17 13,21 * * *" # 9am and 5pm EDT, 6am and 2pm PDT
    - cron: "23 8 * * 6" # weekly
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [frequent, weekly]
        default: frequent
permissions:
  contents: write
  pull-requests: write
env:
  # Inputs that only fetch prebuilt or already-cached outputs. Every other
  # root input is updated in the weekly lane.
  FREQUENT_INPUTS: t3code helium zen-browser multiverse chaotic nix-index-database hermes-agent yiju
jobs:
  update-nix-flake:
    runs-on: ubuntu-latest
    steps:
      - id: lane
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            lane="${{ inputs.lane }}"
          elif [ "${{ github.event.schedule }}" = "23 8 * * 6" ]; then
            lane=weekly
          else
            lane=frequent
          fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: |
          if [ "${{ steps.lane.outputs.lane }}" = frequent ]; then
            read -ra inputs <<< "$FREQUENT_INPUTS"
          else
            mapfile -t inputs < <(nix flake metadata --json | jq -r --arg frequent "$FREQUENT_INPUTS" '.locks.nodes.root.inputs | keys - ($frequent | split(" ")) | .[]')
          fi
          nix flake update "${inputs[@]}"
      - id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          title: Update flake lock (${{ steps.lane.outputs.lane }})
          body: ${{ steps.lane.outputs.lane == 'weekly' && '@ominit' || '' }}
          commit-message: update flake lock (${{ steps.lane.outputs.lane }})
          branch: flake-update-${{ steps.lane.outputs.lane }}
          delete-branch: true
          base: main
          draft: false
      - if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ github.token }}
